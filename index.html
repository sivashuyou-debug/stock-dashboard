const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = v => v == null ? "—" : v.toLocaleString("ja-JP", {
  minimumFractionDigits: Math.abs(v) < 1000 ? 2 : 0, maximumFractionDigits: Math.abs(v) < 1000 ? 2 : 0 });
const pct = v => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const tone = v => v == null ? "flat" : v > 0 ? "up" : v < 0 ? "down" : "flat";

function ago(ts) {
  const d = new Date(ts.replace(" ", "T") + ":00+09:00");
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 60) return Math.max(m, 1) + "分前";
  if (m < 60 * 24) return Math.round(m / 60) + "時間前";
  return Math.round(m / 1440) + "日前";
}
function newsList(items) {
  if (!items || !items.length) return `<li class="empty">ニュースが取得できていません</li>`;
  return items.map(n => `<li><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>
    <div class="muted">${esc(n.source)}・${ago(n.published)}</div></li>`).join("");
}
function spark(vals) {
  vals = vals.filter(v => v != null).slice(-40);
  if (vals.length < 2) return "";
  const min = Math.min(...vals), max = Math.max(...vals), r = max - min || 1;
  const d = vals.map((y, i) => (i ? "L" : "M") + (i / (vals.length - 1) * 100).toFixed(2) + " " + (30 - (y - min) / r * 26).toFixed(2)).join(" ");
  const col = vals[vals.length - 1] >= vals[0] ? css("--up") : css("--down");
  const gid = "g" + Math.random().toString(36).slice(2, 8);
  return `<svg viewBox="0 0 100 32" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L100 32 L0 32 Z" fill="url(#${gid})" stroke="none"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

let group = "すべて", selected = null, mode = "D126", charts = [];

function renderTabs() {
  const groups = ["すべて", ...new Set(DATA.tickers.map(t => t.group))];
  document.getElementById("tabs").innerHTML = groups.map(g =>
    `<button class="${g === group ? "on" : ""}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { group = b.dataset.g; renderTabs(); renderGrid(); });
}

function renderGrid() {
  const list = DATA.tickers.filter(t => group === "すべて" || t.group === group);
  document.getElementById("grid").innerHTML = list.map(t => {
    const trend = (t.signals || []).find(s => s.label === "トレンド");
    const src = t.hourly.length ? t.hourly.map(h => h[4]) : t.daily.map(d => d[4]);
    return `<div class="card panel ${t.symbol === selected ? "sel" : ""}" data-s="${esc(t.symbol)}" title="${esc(t.desc || "")}">
      <div class="top"><div class="name">${esc(t.name)}</div><span class="chip">${esc(t.group)}</span></div>
      <div class="price">${fmt(t.last)}</div>
      <div class="row"><span class="num ${tone(t.chg)}">${pct(t.chg)}</span>
        ${trend ? `<span class="badge ${trend.tone}">${esc(trend.value.replace("（もみ合い）", ""))}</span>` : ""}</div>
      ${spark(src)}
    </div>`;
  }).join("");
  document.querySelectorAll(".card").forEach(c => c.onclick = () => {
    selected = c.dataset.s; renderGrid(); renderDetail();
    document.getElementById("detail").scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

const MODES = [["D63", "日足 3ヶ月"], ["D126", "日足 6ヶ月"], ["D260", "日足 1年"], ["|"], ["H7", "1時間足 1週"], ["H31", "1時間足 1ヶ月"]];

function baseOpts(hourly) {
  return {
    autoSize: true,
    layout: { background: { type: "solid", color: "transparent" }, textColor: css("--muted"),
      fontFamily: getComputedStyle(document.body).fontFamily },
    grid: { vertLines: { color: css("--grid") }, horzLines: { color: css("--grid") } },
    rightPriceScale: { borderColor: css("--border") },
    timeScale: { borderColor: css("--border"), timeVisible: hourly, secondsVisible: false },
    crosshair: { mode: 0 },
    // ページをスクロールしたときにチャートが拡大縮小しないように（ドラッグでの移動は可能）
    handleScroll: { mouseWheel: false, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
    handleScale: { mouseWheel: false, pinch: true, axisPressedMouseMove: true },
    localization: { locale: "ja-JP", dateFormat: "yyyy/MM/dd" },
  };
}
const hourTime = ts => { const [d, t] = ts.split(" "); const [y, m, dd] = d.split("-").map(Number); const [hh, mm] = t.split(":").map(Number); return Date.UTC(y, m - 1, dd, hh, mm) / 1000; };

function drawCharts(t) {
  charts.forEach(c => c.remove()); charts = [];
  if (typeof LightweightCharts === "undefined") {
    document.getElementById("c-main").innerHTML = `<div class="empty">チャート部品を読み込めませんでした（インターネット接続を確認してください）</div>`;
    return;
  }
  const hourly = mode[0] === "H";
  const UP = css("--up"), DOWN = css("--down");
  const main = LightweightCharts.createChart(document.getElementById("c-main"), baseOpts(hourly));
  charts.push(main);
  const candle = main.addCandlestickSeries({ upColor: UP, downColor: DOWN, wickUpColor: UP, wickDownColor: DOWN, borderVisible: false });
  candle.priceScale().applyOptions({ scaleMargins: { top: 0.06, bottom: hourly ? 0.06 : 0.22 } });

  if (hourly) {
    const days = +mode.slice(1);
    const pts = t.hourly;
    const end = pts.length ? hourTime(pts[pts.length - 1][0]) : 0;
    const data = pts.filter(p => hourTime(p[0]) >= end - days * 86400)
      .map(p => ({ time: hourTime(p[0]), open: p[1], high: p[2], low: p[3], close: p[4] }));
    candle.setData(data);
    main.timeScale().fitContent();
    return;
  }

  const d = t.daily;
  candle.setData(d.map(r => ({ time: r[0], open: r[1], high: r[2], low: r[3], close: r[4] })));
  const line = (chart, idx, color, w = 1.5) => {
    const s = chart.addLineSeries({ color, lineWidth: w, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
    s.setData(d.map(r => r[idx] == null ? { time: r[0] } : { time: r[0], value: r[idx] }));
    return s;
  };
  line(main, 6, css("--ma25"));
  line(main, 7, css("--ma75"));
  if (d.some(r => r[5])) {
    const vol = main.addHistogramSeries({ priceScaleId: "vol", priceFormat: { type: "volume" }, lastValueVisible: false, priceLineVisible: false });
    vol.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
    vol.setData(d.map(r => ({ time: r[0], value: r[5] || 0, color: (r[4] >= r[1] ? UP : DOWN) + "55" })));
  }

  const rsiC = LightweightCharts.createChart(document.getElementById("c-rsi"), baseOpts(false));
  charts.push(rsiC);
  const rsi = line(rsiC, 8, css("--accent"));
  [70, 30].forEach(p => rsi.createPriceLine({ price: p, color: css("--muted"), lineWidth: 1, lineStyle: 2, axisLabelVisible: true }));

  const macdC = LightweightCharts.createChart(document.getElementById("c-macd"), baseOpts(false));
  charts.push(macdC);
  const hist = macdC.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false });
  hist.setData(d.map(r => r[11] == null ? { time: r[0] } : { time: r[0], value: r[11], color: (r[11] >= 0 ? UP : DOWN) + "88" }));
  line(macdC, 9, css("--accent"));
  line(macdC, 10, css("--ma25"));

  // 3つのチャートの横スクロールを連動
  let syncing = false;
  charts.forEach(c => c.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (syncing || !r) return; syncing = true;
    charts.forEach(o => o !== c && o.timeScale().setVisibleLogicalRange(r));
    syncing = false;
  }));
  const bars = +mode.slice(1);
  main.timeScale().setVisibleLogicalRange({ from: d.length - bars, to: d.length + 1 });
}

function renderDetail() {
  const t = DATA.tickers.find(x => x.symbol === selected);
  const el = document.getElementById("detail");
  if (!t) { el.innerHTML = `<div class="empty">銘柄のカードを選ぶと、チャートと分析が表示されます</div>`; return; }
  const hourly = mode[0] === "H";
  el.innerHTML = `
    <div class="dhead">
      <div><h2>${esc(t.name)} <span class="muted">${esc(t.symbol)}</span></h2>
        ${t.desc ? `<div class="muted">${esc(t.desc)}</div>` : ""}
        <div><span class="big">${fmt(t.last)}</span>
          <span class="num ${tone(t.chg)}">前日比 ${pct(t.chg)}</span>
          <span class="muted">（${esc(t.lastDate)} 時点）</span></div></div>
      <div class="ranges">${MODES.map(m => m[0] === "|" ? `<span class="sep"></span>` :
        `<button class="${m[0] === mode ? "on" : ""}" data-m="${m[0]}">${m[1]}</button>`).join("")}</div>
    </div>
    <div class="legend">
      <span><i style="background:${css("--up")}"></i>上がった日</span>
      <span><i style="background:${css("--down")}"></i>下がった日</span>
      ${hourly ? `<span>1本＝1時間の値動き（日本時間）</span>` : `
      <span><i style="background:${css("--ma25")}"></i>25日平均線</span>
      <span><i style="background:${css("--ma75")}"></i>75日平均線</span>
      <span>下の薄い棒＝出来高（売買された量）</span>`}
    </div>
    <div id="c-main"></div>
    ${hourly ? `<div class="muted" style="margin-top:8px">RSI・MACDは日足で表示します</div>` : `
    <div class="pane-title">RSI（14日）… 70より上は上がりすぎ、30より下は下がりすぎの目安</div>
    <div id="c-rsi"></div>
    <div class="pane-title">MACD … 青線がオレンジ線より上なら上昇の勢い、下なら下落の勢い</div>
    <div id="c-macd"></div>`}
    <div class="two">
      <div><h3>今の状態（自動判定）</h3>
        ${t.signals.length ? `<table class="sig">${t.signals.map(s => `<tr><td>${esc(s.label)}</td>
          <td><div class="${s.tone}">${esc(s.value)}</div><div class="help">${esc(s.help)}</div></td></tr>`).join("")}</table>`
          : `<div class="empty">データが足りないため判定できません</div>`}
      </div>
      <div><h3>${esc(t.name)} の関連ニュース</h3><ul class="news">${newsList(t.news)}</ul></div>
    </div>`;
  el.querySelectorAll(".ranges button").forEach(b => b.onclick = () => { mode = b.dataset.m; renderDetail(); });
  drawCharts(t);
}

if (!DATA) {
  document.getElementById("grid").innerHTML = `<div class="empty">データがありません。collect.py を実行してください。</div>`;
} else {
  document.getElementById("updated").textContent = "最終更新: " + DATA.generated + "（1時間ごとに自動更新）";
  document.getElementById("mnews").innerHTML = newsList(DATA.marketNews);
  selected = DATA.tickers[0]?.symbol;
  renderTabs(); renderGrid(); renderDetail();
}
</script>
