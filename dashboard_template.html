<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>株取引サポート</title>
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07090e">
<meta name="apple-mobile-web-app-title" content="株サポート">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #07090e; --panel: #10141d; --panel-hi: #161b27; --text: #e7eaf0; --muted: #8590a6;
    --border: #1f2635; --grid: #161c28; --accent: #4f8cff; --accent2: #8b5cf6;
    --up: #22d39a; --down: #ff4d6a; --warn: #ffb547; --chip: #1a2030;
    --ma25: #ffb547; --ma75: #b18cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); font-size: 14px; min-height: 100vh;
    font-family: "Inter", "Noto Sans JP", "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif;
    background:
      radial-gradient(1100px 600px at 0% -10%, rgba(79,140,255,.16), transparent 60%),
      radial-gradient(900px 520px at 100% -5%, rgba(139,92,246,.14), transparent 55%),
      var(--bg);
    background-attachment: fixed; }
  a { color: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #232b3b; border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }
  header { padding: 22px 24px 6px; display: flex; flex-wrap: wrap; gap: 6px 16px;
    align-items: center; justify-content: space-between; max-width: 1480px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: .02em; display: flex; align-items: center; gap: 10px;
    background: linear-gradient(90deg, #ffffff, #a9c3ff 60%, #c7b2ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 0 rgba(34,211,154,.6);
    animation: pulse 2s infinite; flex: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,211,154,.55); } 70% { box-shadow: 0 0 0 9px rgba(34,211,154,0); } 100% { box-shadow: 0 0 0 0 rgba(34,211,154,0); } }
  .muted { color: var(--muted); font-size: 12px; }
  .note { max-width: 1480px; margin: 0 auto; padding: 0 24px 10px; }
  .layout { max-width: 1480px; margin: 0 auto; padding: 0 24px 32px;
    display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .panel { background: linear-gradient(180deg, var(--panel-hi), var(--panel)); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 10px 30px rgba(0,0,0,.35); }
  .tabs, .ranges { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs { margin-bottom: 14px; }
  .tabs button, .ranges button { border: 1px solid var(--border); background: rgba(255,255,255,.03);
    color: var(--muted); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 13px;
    font-family: inherit; transition: all .15s; }
  .tabs button:hover, .ranges button:hover { color: var(--text); border-color: #34405a; }
  .tabs button.on, .ranges button.on { background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent; color: #fff; box-shadow: 0 4px 16px rgba(79,140,255,.35); }
  .ranges .sep { width: 1px; background: var(--border); margin: 0 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .card { padding: 13px 14px 10px; cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-2px); border-color: #34405a; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, 0 0 28px rgba(79,140,255,.28); }
  .card .price { font-weight: 600; letter-spacing: .01em; }
  .big { font-weight: 700; }
  .badge { background: color-mix(in srgb, currentColor 12%, transparent); border-color: color-mix(in srgb, currentColor 35%, transparent) !important; }
  .card .top { display: flex; justify-content: space-between; gap: 6px; }
  .card .name { font-weight: 600; font-size: 14px; }
  .chip { font-size: 11px; background: var(--chip); color: var(--muted);
    padding: 1px 7px; border-radius: 999px; height: fit-content; white-space: nowrap; }
  .card .price { font-size: 19px; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .num { font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); } .warn { color: var(--warn); }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .card svg { width: 100%; height: 32px; display: block; margin-top: 6px; }
  .detail { margin-top: 16px; padding: 16px 18px; }
  .detail h2 { margin: 0; font-size: 19px; }
  .dhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .big { font-size: 24px; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 4px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  .pane-title { font-size: 12px; color: var(--muted); margin: 10px 0 2px; }
  #c-main { height: 330px; } #c-rsi { height: 110px; } #c-macd { height: 120px; }
  .two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  table.sig { width: 100%; border-collapse: collapse; }
  table.sig td { padding: 8px 6px; border-top: 1px solid var(--border); vertical-align: top; }
  table.sig td:first-child { white-space: nowrap; font-weight: 600; width: 1%; }
  table.sig .help { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .news { list-style: none; margin: 0; padding: 0; }
  .news li { padding: 9px 0; border-top: 1px solid var(--border); }
  .news li:first-child { border-top: 0; }
  .news a { text-decoration: none; line-height: 1.45; display: block; }
  .news a:hover { color: var(--accent); text-decoration: underline; }
  aside { padding: 14px 16px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  .empty { color: var(--muted); padding: 20px 0; }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; }
  }
  @media (max-width: 700px) {
    header, .note, .layout { padding-left: 16px; padding-right: 16px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .two { grid-template-columns: 1fr; }
    #c-main { height: 260px; }
  }
  /* 保有株 */
  .hold { padding: 16px 18px; margin-bottom: 16px; }
  .hold .sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 10px 0 14px; }
  main { min-width: 0; }
  .hold .sum > div { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .hold .sum .k { color: var(--muted); font-size: 12px; } .hold .sum .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tbl-wrap { overflow-x: auto; }
  table.ht { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 560px; }
  table.ht th { color: var(--muted); font-weight: 500; font-size: 12px; text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.ht td { text-align: right; padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.ht th:first-child, table.ht td:first-child { text-align: left; }
  table.ht .del { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 4px; }
  table.ht .del:hover { color: var(--down); }
  .addform { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: end; }
  .addform label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .addform select, .addform input { background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px; min-width: 0; }
  .addform input { width: 130px; }
  .btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: 0; border-radius: 10px;
    padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .hold-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 13px; padding: 0; }
  /* 取引支援の画面 */
  .views { margin-bottom: 14px; }
  .regime { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .regime .panel { padding: 12px 14px; }
  .regime .lab { font-size: 18px; font-weight: 700; margin: 2px 0 4px; }
  .regime ul { margin: 0; padding-left: 16px; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .tool { padding: 16px 18px; }
  .tool h2 { margin: 0 0 4px; font-size: 18px; }
  .tool .ranges { margin: 10px 0; }
  .assume { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.7; }
  .assume ul { margin: 4px 0 0; padding-left: 18px; }
  .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
  .results > div { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .results .k { color: var(--muted); font-size: 12px; } .results .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .msg { padding: 10px 12px; border-radius: 10px; background: rgba(255,181,71,.1); color: var(--warn); margin-top: 12px; line-height: 1.6; }
  .ask-form { display: flex; gap: 8px; margin-top: 12px; }
  .ask-form input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; font: inherit; font-size: 16px; }
  .ans { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .ans h3 { margin: 0; font-size: 17px; }
  .ans h4 { margin: 14px 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .ans ul { margin: 4px 0 0; padding-left: 18px; line-height: 1.7; }
  .ans details { margin-top: 8px; }
  .ans summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  .curve svg { width: 100%; height: 70px; display: block; margin: 6px 0 12px; }
  table.ht td .sub { color: var(--muted); font-size: 12px; }
  table.ht td.left, table.ht th.left { text-align: left; white-space: normal; }
  .sortable th[data-k] { cursor: pointer; }
  .sortable th[data-k]:hover { color: var(--text); }
  .smallbtn { background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .addform textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; }
  @media (max-width: 700px) { .addform label { flex: 1 1 40%; } .addform input, .addform select { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>株取引サポート</h1>
  <div class="muted" id="updated"></div>
</header>
<div class="note muted">
  ※ データは Yahoo!ファイナンス（米国版）とGoogleニュースから自動取得しています（数分〜20分の遅れあり）。分析は過去の値動きから機械的に計算した目安で、売買をすすめるものではありません。
</div>
<div class="layout">
  <main>
    <div class="tabs views" id="views"></div>
    <div data-view="home">
      <div class="regime" id="regime"></div>
      <section class="hold panel" id="hold"></section>
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="grid"></div>
      <section class="detail panel" id="detail"></section>
    </div>
    <section class="tool panel" data-view="ask" id="ask" hidden></section>
    <section class="tool panel" data-view="test" id="test" hidden></section>
    <section class="tool panel" data-view="screen" id="screen" hidden></section>
    <section class="tool panel" data-view="calc" id="calc" hidden></section>
    <section class="tool panel" data-view="log" id="log" hidden></section>
  </main>
  <aside class="panel">
    <h3>世界のマーケットニュース</h3>
    <ul class="news" id="mnews"></ul>
  </aside>
</div>
<script>
const DATA = /*__DATA__*/null;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = v => v == null ? "—" : v.toLocaleString("ja-JP", {
  minimumFractionDigits: Math.abs(v) < 1000 ? 2 : 0, maximumFractionDigits: Math.abs(v) < 1000 ? 2 : 0 });
const pct = v => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const tone = v => v == null ? "flat" : v > 0 ? "up" : v < 0 ? "down" : "flat";

function ago(ts) {
  const d = new Date(ts.replace(" ", "T") + ":00+09:00");
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 60) return Math.max(m, 1) + "分前";
  if (m < 60 * 24) return Math.round(m / 60) + "時間前";
  return Math.round(m / 1440) + "日前";
}
function newsList(items) {
  if (!items || !items.length) return `<li class="empty">ニュースが取得できていません</li>`;
  return items.map(n => `<li><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>
    <div class="muted">${esc(n.source)}・${ago(n.published)}</div></li>`).join("");
}
function spark(vals) {
  vals = vals.filter(v => v != null).slice(-40);
  if (vals.length < 2) return "";
  const min = Math.min(...vals), max = Math.max(...vals), r = max - min || 1;
  const d = vals.map((y, i) => (i ? "L" : "M") + (i / (vals.length - 1) * 100).toFixed(2) + " " + (30 - (y - min) / r * 26).toFixed(2)).join(" ");
  const col = vals[vals.length - 1] >= vals[0] ? css("--up") : css("--down");
  const gid = "g" + Math.random().toString(36).slice(2, 8);
  return `<svg viewBox="0 0 100 32" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L100 32 L0 32 Z" fill="url(#${gid})" stroke="none"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

let group = "すべて", selected = null, mode = "D126", charts = [];

function renderTabs() {
  const groups = ["すべて", ...new Set(DATA.tickers.map(t => t.group))];
  document.getElementById("tabs").innerHTML = groups.map(g =>
    `<button class="${g === group ? "on" : ""}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { group = b.dataset.g; renderTabs(); renderGrid(); });
}

function renderGrid() {
  const list = DATA.tickers.filter(t => group === "すべて" || t.group === group);
  document.getElementById("grid").innerHTML = list.map(t => {
    const trend = (t.signals || []).find(s => s.label === "トレンド");
    const src = t.hourly.length ? t.hourly.map(h => h[4]) : t.daily.map(d => d[4]);
    return `<div class="card panel ${t.symbol === selected ? "sel" : ""}" data-s="${esc(t.symbol)}" title="${esc(t.desc || "")}">
      <div class="top"><div class="name">${esc(t.name)}</div><span class="chip">${esc(t.group)}</span></div>
      <div class="price">${fmt(t.last)}</div>
      <div class="row"><span class="num ${tone(t.chg)}">${pct(t.chg)}</span>
        ${trend ? `<span class="badge ${trend.tone}">${esc(trend.value.replace("（もみ合い）", ""))}</span>` : ""}</div>
      ${spark(src)}
    </div>`;
  }).join("");
  document.querySelectorAll(".card").forEach(c => c.onclick = () => {
    selected = c.dataset.s; renderGrid(); renderDetail();
    document.getElementById("detail").scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

const MODES = [["D63", "日足 3ヶ月"], ["D126", "日足 6ヶ月"], ["D260", "日足 1年"], ["|"], ["H7", "1時間足 1週"], ["H31", "1時間足 1ヶ月"]];

function baseOpts(hourly) {
  return {
    autoSize: true,
    layout: { background: { type: "solid", color: "transparent" }, textColor: css("--muted"),
      fontFamily: getComputedStyle(document.body).fontFamily },
    grid: { vertLines: { color: css("--grid") }, horzLines: { color: css("--grid") } },
    rightPriceScale: { borderColor: css("--border") },
    timeScale: { borderColor: css("--border"), timeVisible: hourly, secondsVisible: false },
    crosshair: { mode: 0 },
    // ページをスクロールしたときにチャートが拡大縮小しないように（ドラッグでの移動は可能）
    handleScroll: { mouseWheel: false, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
    handleScale: { mouseWheel: false, pinch: true, axisPressedMouseMove: true },
    localization: { locale: "ja-JP", dateFormat: "yyyy/MM/dd" },
  };
}
const hourTime = ts => { const [d, t] = ts.split(" "); const [y, m, dd] = d.split("-").map(Number); const [hh, mm] = t.split(":").map(Number); return Date.UTC(y, m - 1, dd, hh, mm) / 1000; };

function drawCharts(t) {
  charts.forEach(c => c.remove()); charts = [];
  if (typeof LightweightCharts === "undefined") {
    document.getElementById("c-main").innerHTML = `<div class="empty">チャート部品を読み込めませんでした（インターネット接続を確認してください）</div>`;
    return;
  }
  const hourly = mode[0] === "H";
  const UP = css("--up"), DOWN = css("--down");
  const main = LightweightCharts.createChart(document.getElementById("c-main"), baseOpts(hourly));
  charts.push(main);
  const candle = main.addCandlestickSeries({ upColor: UP, downColor: DOWN, wickUpColor: UP, wickDownColor: DOWN, borderVisible: false });
  candle.priceScale().applyOptions({ scaleMargins: { top: 0.06, bottom: hourly ? 0.06 : 0.22 } });

  if (hourly) {
    const days = +mode.slice(1);
    const pts = t.hourly;
    const end = pts.length ? hourTime(pts[pts.length - 1][0]) : 0;
    const data = pts.filter(p => hourTime(p[0]) >= end - days * 86400)
      .map(p => ({ time: hourTime(p[0]), open: p[1], high: p[2], low: p[3], close: p[4] }));
    candle.setData(data);
    main.timeScale().fitContent();
    return;
  }

  const d = t.daily;
  candle.setData(d.map(r => ({ time: r[0], open: r[1], high: r[2], low: r[3], close: r[4] })));
  const line = (chart, idx, color, w = 1.5) => {
    const s = chart.addLineSeries({ color, lineWidth: w, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
    s.setData(d.map(r => r[idx] == null ? { time: r[0] } : { time: r[0], value: r[idx] }));
    return s;
  };
  line(main, 6, css("--ma25"));
  line(main, 7, css("--ma75"));
  if (d.some(r => r[5])) {
    const vol = main.addHistogramSeries({ priceScaleId: "vol", priceFormat: { type: "volume" }, lastValueVisible: false, priceLineVisible: false });
    vol.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
    vol.setData(d.map(r => ({ time: r[0], value: r[5] || 0, color: (r[4] >= r[1] ? UP : DOWN) + "55" })));
  }

  const rsiC = LightweightCharts.createChart(document.getElementById("c-rsi"), baseOpts(false));
  charts.push(rsiC);
  const rsi = line(rsiC, 8, css("--accent"));
  [70, 30].forEach(p => rsi.createPriceLine({ price: p, color: css("--muted"), lineWidth: 1, lineStyle: 2, axisLabelVisible: true }));

  const macdC = LightweightCharts.createChart(document.getElementById("c-macd"), baseOpts(false));
  charts.push(macdC);
  const hist = macdC.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false });
  hist.setData(d.map(r => r[11] == null ? { time: r[0] } : { time: r[0], value: r[11], color: (r[11] >= 0 ? UP : DOWN) + "88" }));
  line(macdC, 9, css("--accent"));
  line(macdC, 10, css("--ma25"));

  // 3つのチャートの横スクロールを連動
  let syncing = false;
  charts.forEach(c => c.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (syncing || !r) return; syncing = true;
    charts.forEach(o => o !== c && o.timeScale().setVisibleLogicalRange(r));
    syncing = false;
  }));
  const bars = +mode.slice(1);

// ---------------------------------------------------------------- サインの過去検証
let btHold = 20, btAmount = 10000, btScope = "日本株";
const btItem = s => DATA.backtest?.items.find(i => i.symbol === s);
const US_COST = 1.16;  // 売買手数料 0.495%×2 ＋ 売却時の為替手数料（25銭÷約150円）
function costPct(symbol, amount) {
  if (!isJPY(symbol)) return US_COST;
  return Math.min(amount, Math.max(52, amount * 0.0055)) / amount * 100;  // ワン株：買付無料、売却0.55%（最低52円）
}
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
const sgnPct = v => v == null || !isFinite(v) ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%";

function btRow(items, key, hold, amount, pooled) {
  const net = [];
  let baseSum = 0, baseN = 0;
  items.forEach(it => {
    const rets = it.trades[key]?.[hold] || [], cost = costPct(it.symbol, amount);
    rets.forEach(r => net.push(r - cost));
    if (it.base[hold] != null && rets.length) { baseSum += (it.base[hold] - cost) * rets.length; baseN += rets.length; }
  });
  const n = net.length;
  if (!n) return { n: 0 };
  const wins = net.filter(r => r > 0), losses = net.filter(r => r <= 0);
  const ev = mean(net), base = baseN ? baseSum / baseN : null;
  const sd = n > 1 ? Math.sqrt(net.reduce((a, r) => a + (r - ev) ** 2, 0) / (n - 1)) : 0;
  const t = base != null && sd ? (ev - base) / (sd / Math.sqrt(n)) : 0;
  const bar = pooled ? 3 : 2;  // まとめは同じ時期のサインが重なるので基準を厳しく
  let verdict, vt;
  if (n < 10) { verdict = "回数不足"; vt = "flat"; }
  else if (t >= bar) { verdict = "平均より良い傾向"; vt = "up"; }
  else if (t <= -bar) { verdict = "平均より悪い傾向"; vt = "down"; }
  else { verdict = "偶然の範囲"; vt = "flat"; }
  return { n, win: wins.length / n * 100, avgW: wins.length ? mean(wins) : null, avgL: losses.length ? mean(losses) : null,
    ev, base, diff: base == null ? null : ev - base, worst: Math.min(...net), verdict, vt };
}

function btTable(items, hold, amount, pooled) {
  const rows = DATA.backtest.strategies.map(st => {
    const r = btRow(items, st.key, hold, amount, pooled);
    if (!r.n) return `<tr><td class="left">${esc(st.name)}<div class="sub">${esc(st.help)}</div></td><td colspan="8" class="muted">この期間にサインなし</td></tr>`;
    return `<tr><td class="left">${esc(st.name)}<div class="sub">${esc(st.help)}</div></td>
      <td class="${tone(r.ev)}"><b>${sgnPct(r.ev)}</b><div class="sub">${amount ? signedYen(amount * r.ev / 100) : ""}</div></td>
      <td>${sgnPct(r.base)}</td><td class="${r.vt}">${esc(r.verdict)}</td>
      <td>${r.n}</td><td>${r.win.toFixed(0)}%</td>
      <td class="up">${sgnPct(r.avgW)}</td><td class="down">${sgnPct(r.avgL)}</td><td class="down">${sgnPct(r.worst)}</td></tr>`;
  }).join("");
  return `<div class="tbl-wrap"><table class="ht" style="min-width:760px"><thead><tr>
    <th class="left">サイン</th><th>1回の期待値</th><th>いつ買っても</th><th>判定</th><th>回数</th><th>勝率</th><th>平均の勝ち</th><th>平均の負け</th><th>最悪の1回</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

let scrOn = new Set(), scrKey = "chg", scrDir = -1;
function renderScreen() {
  const el = document.getElementById("screen");
  let list = (DATA.screen || []).filter(s => [...scrOn].every(k => FILTERS.find(f => f[0] === k)[2](s)));

// ---------------------------------------------------------------- 損切りと株数の計算
let calcSym = null;
function loadCalc() { try { return JSON.parse(localStorage.getItem("calc-v1") || "{}"); } catch { return {}; } }
function saveCalc(c) { try { localStorage.setItem("calc-v1", JSON.stringify(c)); } catch {} }
function sellFee(symbol, amount) {  // 売却時の手数料（銘柄の通貨）
  if (!isJPY(symbol)) return amount * US_COST / 100;
  return Math.min(amount, Math.max(52, amount * 0.0055));
}
function sizePosition({ symbol, buy, stop, risk, capital, rr }) {
  const fx = isJPY(symbol) ? 1 : quote("JPY=X")?.last;
  const riskCur = risk / fx, capCur = capital / fx;
  const lossAt = q => (buy - stop) * q + sellFee(symbol, stop * q);
  let q = Math.min(Math.floor(riskCur / (buy - stop)), Math.floor(capCur / buy));
  while (q > 0 && lossAt(q) > riskCur) q--;
  const target = buy + (buy - stop) * rr;
  const res = { fx, q, target };
  if (q > 0) {
    res.amount = buy * q * fx; res.loss = lossAt(q) * fx;
    res.profit = ((target - buy) * q - sellFee(symbol, target * q)) * fx;
    res.breakeven = res.profit > 0 ? res.loss / (res.loss + res.profit) * 100 : null;
  }
  return res;
}
function renderCalc() {
  const el = document.getElementById("calc");
  const saved = loadCalc();
  calcSym = calcSym || (DATA.screen?.[0]?.symbol);

    <div id="c-out"></div>
    <div class="assume">損切り価格の初期値は「買値 − 1日の平均的な値動き${atr ? `（約${atr.toFixed(1)}%）` : ""}の2倍」です。株価が急に動くと、損切り価格より不利な値段で売れることがあり、損失が許容額を超える場合があります。手数料はマネックスのワン株（買付無料、売却0.55%・最低52円）、米国株は計1.16%で計算し、税金は含みません。米国株は現在のドル円で換算しています。</div>`;
  const out = el.querySelector("#c-out");
  const compute = () => {
    const v = id => parseFloat(el.querySelector(id).value);
    const inp = { symbol: calcSym, buy: v("#c-buy"), stop: v("#c-stop"), risk: v("#c-risk"), capital: v("#c-cap"), rr: v("#c-rr") };
    saveCalc({ capital: inp.capital, risk: inp.risk, rr: inp.rr });

    if (inp.stop >= inp.buy) { out.innerHTML = `<div class="msg">損切り価格は買値より低くしてください</div>`; return; }

      saveHold(h); renderHold(); renderRegime(); showView("home");
      document.getElementById("hold").scrollIntoView({ behavior: "smooth", block: "start" });
    };
  };
  el.querySelectorAll("input").forEach(i => i.oninput = compute);
  el.querySelector("#c-sym").onchange = e => { calcSym = e.target.value; renderCalc(); };
  compute();
}

function tradePL(t) {  // 手数料を引いた損益（円）
  const fx = isJPY(t.symbol) ? 1 : quote("JPY=X")?.last || 0;
  const fee = t.fee != null ? t.fee : sellFee(t.symbol, t.sellPrice * t.qty) * fx;  // 手入力の手数料は円
  const yenPL = (t.sellPrice - t.buyPrice) * t.qty * fx - fee;

}
function logStats(rows) {
  const n = rows.length, wins = rows.filter(r => r.pl > 0), losses = rows.filter(r => r.pl <= 0);

}

const ASK_ALIASES = {
  "9984.T": ["ソフトバンクグループ", "sbg"], "8306.T": ["ufj"], "9983.T": ["ファストリ", "ユニクロ"],
  "4502.T": ["武田"], "3382.T": ["セブン"], "4689.T": ["ヤフー", "ライン"], "4661.T": ["ディズニー"],
  "6594.T": ["日本電産"], "5401.T": ["新日鉄"], "2914.T": ["日本たばこ"], "9432.T": ["日本電信電話"],
  "AAPL": ["アップル"], "MSFT": ["マイクロソフト"], "NVDA": ["エヌビディア"], "AMZN": ["アマゾン"],
  "GOOGL": ["アルファベット", "グーグル", "google"],
};
const normAsk = s => String(s).normalize("NFKC").toLowerCase().replace(/\s/g, "");
const ASK_SUFFIX = /(自動車|グループ|ghd|hd|fg|g|工業|製作所|製薬)$/;
function askNames() {
  return (DATA.screen || []).flatMap(q => {
    const full = normAsk(q.name);
    const names = new Set([full, full.replace(ASK_SUFFIX, ""), normAsk(q.symbol), ...(ASK_ALIASES[q.symbol] || []).map(normAsk)]);
    return [...names].filter(n => n.length >= 2).map(n => ({ n, sym: q.symbol }));
  });
}
function askFind(text) {
  // 長い名前を優先して文章から銘柄を探す。同じ箇所に複数の候補があるときは候補のまま返す
  const t = normAsk(text), hits = [];
  askNames().forEach(({ n, sym }) => {
    for (let i = t.indexOf(n); i >= 0; i = t.indexOf(n, i + 1)) hits.push({ a: i, b: i + n.length, sym });
  });
  for (const m of t.matchAll(/(^|\D)(\d{4})(?![\d円年株%])/g)) {
    const sym = m[2] + ".T", a = m.index + m[1].length;
    if (quote(sym) && (DATA.screen || []).some(q => q.symbol === sym)) hits.push({ a, b: a + 4, sym });
  }
  hits.sort((x, y) => (y.b - y.a) - (x.b - x.a) || x.a - y.a);
  const spans = [];
  hits.forEach(h => {
    const same = spans.find(s => s.a === h.a && s.b === h.b);
    if (same) { if (!same.syms.includes(h.sym)) same.syms.push(h.sym); return; }
    if (!spans.some(s => h.a < s.b && s.a < h.b)) spans.push({ a: h.a, b: h.b, syms: [h.sym] });
  });
  return spans.sort((x, y) => x.a - y.a);
}
function daysUntil(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const [ty, tm, td] = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10).split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(ty, tm - 1, td)) / 86400000);
}
function askStat(r) {
  if (!r.n) return "サインなし";
  return `${r.n}回・勝率${r.win.toFixed(0)}%・期待値 <b class="${tone(r.ev)}">${sgnPct(r.ev)}</b>（いつ買っても ${sgnPct(r.base)}）・${esc(r.verdict)}`;
}

  }).join("")}</ul>` : `<div>直近5営業日に、検証している4つのサインは出ていません。</div>`;

  const baseNet = item.base[20] == null ? null : item.base[20] - costPct(sym, btAmount);
  const heldHtml = held.length ? `<h4>あなたの保有状況</h4><ul>${held.map(h => {
    const rate = (q.last / h.price - 1) * 100;
    return `<li>${h.qty.toLocaleString("ja-JP")}株・買値 ${cur}${fmt(h.price)}・損益率 <span class="${tone(rate)}">${pct(rate)}</span>
      ${h.stop ? `・損切り ${cur}${fmt(h.stop)}${q.last <= h.stop ? `（<span class="down">到達</span>）` : ""}` : ""}
      ${h.target ? `・目標 ${cur}${fmt(h.target)}${q.last >= h.target ? `（<span class="up">到達</span>）` : ""}` : ""}</li>`;
  }).join("")}</ul>` : "";

  let sizeHtml = "";
  if (!sell && q.atr) {
    const c = loadCalc(), capital = c.capital ?? 10000, risk = c.risk ?? 500, rr = c.rr ?? 2;
    const stop = jp ? Math.round(q.last * (1 - q.atr * 2 / 100)) : Math.round(q.last * (1 - q.atr * 2 / 100) * 100) / 100;
    const r = sizePosition({ symbol: sym, buy: q.last, stop, risk, capital, rr });
    sizeHtml = `<h4>買う場合の目安（資金${yen(capital)}・許容損失${yen(risk)}の設定）</h4>
      <div>${r.fx && r.q ? `${r.q.toLocaleString("ja-JP")}株・購入金額 ${yen(r.amount)}／損切り価格 ${cur}${fmt(stop)}（損失 ${signedYen(-r.loss)}）`
        : `損切り価格を ${cur}${fmt(stop)} とすると、1株でも資金または許容損失を超えます。`}</div>
      <button class="smallbtn" data-askcalc="${esc(sym)}" style="margin-top:6px">損切り計算で詳しく見る</button>`;
  }

  return `<div class="ans">
    <h3>${esc(q.name)} <span class="muted">${esc(q.symbol)}</span></h3>
    <div><span class="big">${cur}${fmt(q.last)}</span> <span class="num ${tone(q.chg)}">前日比 ${pct(q.chg)}</span> <span class="muted">（${esc(q.lastDate)} 時点）</span></div>
    ${notes.length ? `<h4>確認しておきたい点</h4><ul class="warn">${notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
    <h4>今の状態</h4>
    <ul><li>トレンド：<span class="${q.trend === "上昇" ? "up" : q.trend === "下降" ? "down" : "flat"}">${esc(q.trend)}</span></li>
      <li>RSI：${q.rsi == null ? "—" : q.rsi.toFixed(0)}（70以上は上がりすぎ、30以下は下がりすぎの目安）</li>
      <li>25日平均との差：<span class="${tone(q.gap25)}">${pct(q.gap25)}</span></li>
      <li>1日の平均的な値動き：${q.atr == null ? "—" : "約" + q.atr.toFixed(1) + "%"}</li></ul>
    <h4>相場全体（${area}）</h4><div class="${reg ? reg.tone : ""}">${reg ? esc(reg.label) : "判定なし"}</div>
    <h4>決算予定</h4><div>${q.earn ? `${esc(q.earn)}（${earnIn === 0 ? "本日" : "あと" + earnIn + "日"}）` : "予定日の情報なし"}</div>
    <h4>直近のサインと過去の成績（買って20営業日後に売った場合）</h4>
    ${sigHtml}
    <div class="muted" style="margin-top:4px">この銘柄をサインに関係なく買った場合の平均：${sgnPct(baseNet)}</div>
    <details><summary>4つのサインすべての成績を見る</summary>${btTable([item], 20, btAmount, false)}</details>
    ${heldHtml}${sizeHtml}
  </div>`;
}
function askRun(text, forced) {
  const out = document.getElementById("ask-out");
  try { sessionStorage.setItem("ask", text); } catch {}
  const spans = forced ? [{ syms: [forced] }] : askFind(text);
  if (!spans.length) {
    out.innerHTML = `<div class="msg">質問の中から銘柄名を見つけられませんでした。「トヨタ」のような銘柄名か、「7203」のような証券コードを入れてください。答えられるのは「絞り込み」にある${(DATA.screen || []).length}銘柄です（日経平均などの指数は対象外です）。</div>`;
    return;
  }
  const unclear = spans.find(s => s.syms.length > 1);
  if (unclear) {
    out.innerHTML = `<div class="ans"><div>どちらの銘柄ですか？</div><div class="ranges">${unclear.syms.map(s => `<button data-pick="${esc(s)}">${esc(quote(s).name)}</button>`).join("")}</div></div>`;
    out.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => askRun(text, b.dataset.pick));
    return;
  }
  const sell = /売/.test(text) && !/買/.test(text);
  out.innerHTML = spans.slice(0, 3).map(s => askAnswer(s.syms[0], sell)).join("") +
    (spans.length > 3 ? `<div class="muted" style="margin-top:10px">一度に表示できるのは3銘柄までです。</div>` : "") +
    `<div class="assume"><b>この回答について：</b>アプリ内のデータを決まった手順でまとめたもので、AIの判断ではありません。「買い」「売り」の判断は行いませんので、最終判断はご自身でお願いします。
      <ul><li>データ：Yahoo!ファイナンスの日足。過去検証は${esc(DATA.backtest.from)}以降</li>
      <li>過去の成績：サインの翌営業日の始値で買い、20営業日目の終値で売却した計算。1回${yen(btAmount)}の手数料を差し引き、配当・税金は含みません</li>
      <li>サインが何営業日か前のものは、検証の買うタイミングとずれています</li>
      <li>損切り価格は「現在値 − 平均的な値動きの2倍」の仮の値です。決算予定日は変わることがあります。過去の結果は将来の利益を保証しません</li></ul></div>`;
  out.querySelectorAll("[data-askcalc]").forEach(b => b.onclick = () => { calcSym = b.dataset.askcalc; renderCalc(); showView("calc"); });
}
function renderAsk() {
  const el = document.getElementById("ask");
  const samples = ["今日、トヨタの株を買おうと思う", "三菱UFJはどう？", "任天堂とソニーを比べたい"];
  el.innerHTML = `<h2>質問箱</h2>
    <div class="muted">銘柄名を入れて質問すると、今の状態と過去の成績をまとめて表示します。</div>
    <form class="ask-form" id="ask-form"><input id="ask-q" enterkeyhint="send" autocomplete="off" placeholder="例：今日、トヨタの株を買おうと思う"><button class="btn">質問</button></form>
    <div class="ranges">${samples.map(s => `<button type="button" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    <div id="ask-out"></div>`;
  const input = el.querySelector("#ask-q");
  el.querySelector("#ask-form").onsubmit = e => {
    e.preventDefault();
    if (input.value.trim()) { askRun(input.value.trim()); input.blur(); }
  };
  el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { input.value = b.dataset.s; askRun(b.dataset.s); });
  let last = "";
  try { last = sessionStorage.getItem("ask") || ""; } catch {}
  if (last) { input.value = last; askRun(last); }  // 自動の再読み込み後も回答を残す
}

// ---------------------------------------------------------------- 画面の切り替えと初期表示
const VIEWS = [["home", "ホーム"], ["ask", "質問箱"], ["test", "サイン検証"], ["screen", "絞り込み"], ["calc", "損切り計算"], ["log", "取引記録"]];
let view = "home";
function showView(v) {
  view = v;
  try { sessionStorage.setItem("view", v); } catch {}
  document.getElementById("views").innerHTML = VIEWS.map(x => `<button class="${x[0] === v ? "on" : ""}" data-v="${x[0]}">${x[1]}</button>`).join("");
  document.querySelectorAll("#views button").forEach(b => b.onclick = () => showView(b.dataset.v));
  document.querySelectorAll("main [data-view]").forEach(e => e.hidden = e.dataset.view !== v);
}

if (!DATA) {
  document.getElementById("grid").innerHTML = `<div class="empty">データがありません。collect.py を実行してください。</div>`;
} else {
  document.getElementById("updated").textContent = "最終更新: " + DATA.generated + "（1時間ごとに自動更新）";
  document.getElementById("mnews").innerHTML = newsList(DATA.marketNews);
  selected = DATA.tickers[0]?.symbol;
  let startView = "home";
  try { startView = sessionStorage.getItem("view") || "home"; } catch {}
  showView(VIEWS.some(x => x[0] === startView) ? startView : "home");
  renderRegime(); renderTabs(); renderGrid(); renderDetail();
  renderHold(); renderTest(); renderScreen(); renderCalc(); renderLog(); renderAsk();
}

// 15分ごとに最新データへ再読み込み（入力中は待つ）
const loadedAt = Date.now();
setInterval(() => {
  const a = document.activeElement;
  if (Date.now() - loadedAt > 15 * 60 * 1000 && !(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) location.reload();
}, 60 * 1000);
</script>
